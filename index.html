<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GBC Corporate | Global Business Setup & Consulting</title>
    <meta name="description" content="GBC Corporate offers premier business setup, legal advisory, and corporate tax services in the UAE. Launch and scale your business effortlessly." />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://gbccorporate.com/" />
    <meta property="og:title" content="GBC Corporate | Global Business Setup & Consulting" />
    <meta property="og:description" content="GBC Corporate offers premier business setup, legal advisory, and corporate tax services in the UAE. Launch and scale your business effortlessly." />
    <meta property="og:image" content="/images/LOGO_GBC.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://gbccorporate.com/" />
    <meta property="twitter:title" content="GBC Corporate | Global Business Setup & Consulting" />
    <meta property="twitter:description" content="GBC Corporate offers premier business setup, legal advisory, and corporate tax services in the UAE. Launch and scale your business effortlessly." />
    <meta property="twitter:image" content="/images/LOGO_GBC.png" />

    <!-- Meta Pixel (GBC Ads dataset). ID comes from VITE_META_PIXEL_ID in .env.
         Route-change PageViews are sent by src/components/meta/MetaPageViewTracker.jsx -->
    <script>
      (function () {
        var pixelId = "%VITE_META_PIXEL_ID%";
        if (!/^\d+$/.test(pixelId)) return; // not configured yet
        !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
        n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
        n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
        t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
        document,'script','https://connect.facebook.net/en_US/fbevents.js');
        fbq('init', pixelId);
        fbq('track', 'PageView');
      })();
    </script>
  </head>
  <body>
    <noscript>
      <img height="1" width="1" style="display:none" alt=""
        src="https://www.facebook.com/tr?id=%VITE_META_PIXEL_ID%&ev=PageView&noscript=1" />
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
